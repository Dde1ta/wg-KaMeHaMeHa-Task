Parameters:
  
  DynamodbTemplateURL:
    Type: String
    Default: "https://cloudformation-us-west-2-templates-295345165437-us-west-2-an.s3.us-west-2.amazonaws.com/kamehameha/main/us-west-2/DynamoDB.yaml"
    Description: "Template url of DynamoDB Resource"

  BucketTemplateUrl:
    Type: String
    Default: "https://cloudformation-us-west-2-templates-295345165437-us-west-2-an.s3.us-west-2.amazonaws.com/kamehameha/main/us-west-2/S3.yaml"
    Description: "Template url of s3 bucket"

  LambdaFunctionTemplateUrl:
    Type: String
    Default: "https://cloudformation-us-west-2-templates-295345165437-us-west-2-an.s3.us-west-2.amazonaws.com/kamehameha/main/us-west-2/Lambda.yaml"
    Description: "Template url of enabler lambda function"
  
  SSEKMSKeyTemplateUrl:
    Type: String
    Default: "https://cloudformation-us-west-2-templates-295345165437-us-west-2-an.s3.us-west-2.amazonaws.com/kamehameha/main/us-west-2/KMS-Main-Key.yaml"
    Description: "Template url of sse-kms-multi-region-key"
  
  CreateKMSKey:
    Type: String
    Default: "False"
    AllowedValues: ["True", "False"]
    Description: "Make Server Side Encryption Key?"

Resources:
  
  KMSMultiRegionKeyForSSEKMS:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: Delete
    UpdateReplacePolicy: Retain
    Properties:
      TemplateURL: !Ref SSEKMSKeyTemplateUrl
      Parameters:
        CreateMultiRegionKey : !Ref CreateKMSKey
  
  DynamoDBTableWithStream:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: Delete
    UpdateReplacePolicy: Retain
    Properties:
      TemplateURL: !Ref DynamodbTemplateURL
  
  USWest2S3Bucket:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: Delete
    UpdateReplacePolicy: Retain
    DependsOn: KMSMultiRegionKeyForSSEKMS
    Properties:
      TemplateURL: !Ref BucketTemplateUrl
      
  EnablerLambdaFunction:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: Delete
    UpdateReplacePolicy: Retain
    Properties:
      TemplateURL: !Ref LambdaFunctionTemplateUrl
      Parameters:
        DynamodbStreamArn: !GetAtt DynamoDBTableWithStream.Outputs.DynamoDBTableStreamArn
        EnablerLambdaFunctionEnvBucketName: !GetAtt USWest2S3Bucket.Outputs.USWest2S3BucketName
        EnablerLambdaFunctionEnvObjectKey: teenage-mutant-ninja-turtles.json
