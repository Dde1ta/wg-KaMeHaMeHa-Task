Parameters:
  CreateReplicaKey:
    Type: String
    AllowedValues: ["True", "False"]
    Default: "False"

  KMSMainKeyArn:
    Type: String
    Default: "not:set"


Conditions:
  IsCreateReplicaKeyTrue: !Equals [!Ref CreateReplicaKey, "True"]

  IsCreateMultiRegionKeyTrue: !Not
    - Condition: IsCreateReplicaKeyTrue


Resources:
  KMSReplicaKey:
    Type: AWS::KMS::ReplicaKey
    Condition: IsCreateReplicaKeyTrue
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PrimaryKeyArn: !Ref KMSMainKeyArn
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Effect: "Allow"
            Principal:
              AWS: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root"
            Action: "kms:*"
            Resource: "*"

  KMSMainKey:
    Type: AWS::KMS::Key
    Condition: IsCreateMultiRegionKeyTrue
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: This Key is for S3 Server Side Encryption - KMS
      MultiRegion: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Effect: "Allow"
            Principal:
              AWS: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root"
            Action: "kms:*"
            Resource: "*"


Outputs:
  KMSMainKeyArn:
    Description: "KMS Key ARN for S3 SSE-KMS"
    Condition: IsCreateMultiRegionKeyTrue
    Value: !GetAtt KMSMainKey.Arn

  KMSReplicaKeyArn:
    Description: "Replica Key Arn for S3 SSE-KMS"
    Condition: IsCreateReplicaKeyTrue
    Value: !GetAtt KMSReplicaKey.Arn
